[workspace]
resolver = "2"
members = [
    "crates/atakit-core",
    "crates/atakit-image",
    "crates/atakit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Shared
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"

# Network
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
owo-colors = "4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal
atakit-core = { path = "crates/atakit-core" }
atakit-image = { path = "crates/atakit-image" }
