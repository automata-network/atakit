[workspace]
resolver = "2"
members = [
    "crates/atakit-core",
    "crates/atakit-config",
    "crates/atakit-github",
    "crates/atakit-image",
    "crates/atakit-workload",
    "crates/atakit-attestation",
    "crates/atakit-attestation-client",
    "crates/atakit-cloud",
    "crates/atakit-cli",
]
exclude = [
    "vendor/lazy_static",
]

[workspace.package]
version = "0.5.5"
edition = "2021"

[workspace.dependencies]
# Shared
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_bytes = "0.11"
base64 = "0.22"
tracing = "0.1"
thiserror = "2"
libc = "0.2"

# Network
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
urlencoding = "2"

# Build / archive
tempfile = "3"
toml = "0.8"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
sha3 = "0.10"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Blockchain
alloy-ext = "1.7.4"
alloy = { version = "1.7.3", default-features = false }
automata-tee-workload-measurement = "0.1.2"
aws-lc-rs = "1"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
signature = "2"
x509-parser = { version = "0.16", features = ["verify"] }
x509-cert = "0.2.5"
pem = "3"
rcgen = "0.13"

# Pin all Automata DCAP crates to the same reviewed upstream commit.
dcap-rs = { git = "https://github.com/automata-network/automata-dcap-attestation", rev = "e370572e5c6fa267005c6eb466965a37034f7266" }
automata-dcap-network-registry = { git = "https://github.com/automata-network/automata-dcap-attestation", rev = "e370572e5c6fa267005c6eb466965a37034f7266" }
pccs-reader-rs = { git = "https://github.com/automata-network/automata-dcap-attestation", rev = "e370572e5c6fa267005c6eb466965a37034f7266" }

# Async
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
owo-colors = "4"
shell-escape = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal
atakit-core = { path = "crates/atakit-core" }
atakit-config = { path = "crates/atakit-config" }
atakit-github = { path = "crates/atakit-github" }
atakit-image = { path = "crates/atakit-image" }
atakit-workload = { path = "crates/atakit-workload" }
atakit-attestation = { path = "crates/atakit-attestation" }
atakit-attestation-client = { path = "crates/atakit-attestation-client" }
atakit-cloud = { path = "crates/atakit-cloud" }

[patch.crates-io]
# lazy_static 1.5.0 pins the yanked spin 0.9.8 release. Keep its public API
# unchanged while moving the optional no_std backend to the compatible current
# spin release. See vendor/lazy_static/README.md.
lazy_static = { path = "vendor/lazy_static" }


# Optimize compression and crypto in dev builds -- decompression
# of large .atawl archives is unusably slow without this.
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
