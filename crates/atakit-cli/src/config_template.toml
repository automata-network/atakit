# atakit configuration
# Precedence: CLI args > env vars > this file > defaults
#
# This template is written on first run. Every section is commented
# out -- edit the ones you need to configure repositories, credentials,
# cloud targets, etc. `[image.repositories]` and
# `[workload.repositories]` both default to empty: commands that need
# a specific target (`image pull`, `workload push`, `image ls --remote`,
# etc.) error with "no repositories configured" until you add at
# least one entry.

# ─── Chains ──────────────────────────────────────────────────────────
#
# Named blockchain configurations. Cloud targets and publish commands
# reference a chain by name. `rpc_url` and `session_registry` are
# required; `workload_registry` and `base_image_registry` are optional
# (derived on-chain from `session_registry` if omitted).

# [chains.mainnet]
# rpc_url = "https://..."
# session_registry = "0x..."
# workload_registry = "0x..."
# base_image_registry = "0x..."
# register_cvm_expire_offset = 300

# ─── Keys ────────────────────────────────────────────────────────────
#
# Named key configurations. Two modes:
# - mode = "provisioned": operator provides the private key via
#   EXACTLY ONE of `file` / `command` / `env`. Cloud targets reference
#   these for owner_key and (optionally) gas_wallet.
# - mode = "self_generated": the portal generates the key at init time.
#   No `file` / `command` / `env` allowed.
#
# `type` is required: "es256k", "es256", or "rs256".

# [keys.owner]
# type = "es256k"
# mode = "provisioned"
# file = "~/.config/atakit/owner.key"

# [keys.gas]
# type = "es256k"
# mode = "self_generated"

# [keys.gas-provisioned]
# type = "es256k"
# mode = "provisioned"
# command = ["vault", "read", "-field=key", "secret/gas"]

# ─── GitHub credentials ───────────────────────────────────────────────
#
# Named token sources for GitHub API access. Each credential sets
# EXACTLY ONE of `file` / `command` / `env`. Repositories reference a
# credential by name via `credential = "<name>"`; a repository without
# `credential` makes anonymous requests (public repos only).
#
# `command` credentials default to a 30-second timeout. Override per
# credential with `timeout_secs = <n>` when a helper is known to be
# slow (biometric prompts, remote HSMs). `timeout_secs` is only valid
# alongside `command`.
#
# Section form is also valid when a credential wants inline comments:
#   [github.credentials.public]
#   file = "~/.config/atakit/tokens/public"

# [github.credentials]
# public      = { file    = "~/.config/atakit/tokens/public" }
# private     = { command = ["pass", "show", "github/atakit-private"] }
# ci          = { env     = "GH_CI_TOKEN" }
# slow-helper = { command = ["op", "read", "op://Private/gh/token"], timeout_secs = 90 }

# ─── Image repositories ───────────────────────────────────────────────
#
# Named GitHub repositories that hold `.atabi` image archives.
# Declaration order matters: the first entry is the implicit default
# for `image pull` when no image reference is given.
#
# Each entry may set `list_limit = <n>` to override the global
# `[image] list_limit`. Precedence: `--limit` CLI flag > per-repo
# `list_limit` > global `[image] list_limit`.

[image]
# Global default limit for `image ls`.
# list_limit = 10
# Default platforms for `image pull` (comma-separated: gcp, aws, azure).
# platforms = ["gcp"]

# [image.repositories]
# automata = { repo = "automata-network/automata-linux" }
# debug    = { repo = "automata-network/debug-linux" }
# private  = { repo = "myorg/private-images", credential = "private" }
# fast-dev = { repo = "myorg/dev-mirror", list_limit = 3 }

# ─── Build ────────────────────────────────────────────────────────────

[build]
# Container engine: "auto", "docker", or "podman".
# container_engine = "auto"

# ─── Publish ──────────────────────────────────────────────────────────
#
# References to [chains] and [keys] entries for workload publish
# commands. CLI flags --chain and --owner-key override these.

[publish]
# chain = "mainnet"
# owner_key = "owner"
# relay_key = "relayer"

# ─── Workload repositories ────────────────────────────────────────────
#
# Tagged inline tables: each entry is either `type = "http"` (in-house
# workload registry service) or `type = "github"` (GitHub releases).
# Declaration order matters: the first entry is the implicit default
# for `workload push` when no `--repository` is given.

# [workload.repositories]
# main       = { type = "http",   url  = "https://registry.example.com" }
# gh-public  = { type = "github", repo = "automata-network/workload-archives", credential = "public" }
# gh-private = { type = "github", repo = "myorg/private-workloads",            credential = "private" }

# ─── Cloud ────────────────────────────────────────────────────────────

[cloud]

# Cloud providers (platform + account + region).
# [cloud.providers.my-gcp]
# platform = "gcp"
# project = "my-gcp-project"
# region = "us-central1-a"

# [cloud.providers.my-azure]
# platform = "azure"
# subscription = "your-subscription-id"
# region = "eastus"

# Image library: CC capabilities for image registration.
# Simple form:   "name:tag" = ["SEV_SNP", "TDX"]
# Extended form:  [cloud.images."name:tag"]
#                 cc_types = ["SEV_SNP", "TDX"]
# [cloud.images]
# "my-baseimage:v0.1.0" = ["SEV_SNP", "TDX"]

# Cloud deployment targets. Each target references a chain, owner key,
# and gas wallet by name.
# [cloud.targets.my-gcp-tdx]
# provider = "my-gcp"
# vmtype = "c3-standard-4"        # cc_type inferred as TDX
# image = "my-baseimage:v0.1.0"
# boot_disk_size = "100GB"        # override OS disk size (default 4GB, min 2GB, must be >= workload minimum)
# chain = "mainnet"
# owner_key = "owner"
# gas_wallet = "gas"

# [cloud.targets.my-azure-snp]
# provider = "my-azure"
# vmtype = "Standard_DC4as_v5"    # cc_type inferred as SEV_SNP
# image = "my-baseimage:v0.1.0"
# boot_disk_size = "100GB"        # override OS disk size (default 4GB, min 2GB, must be >= workload minimum)
# chain = "mainnet"
# owner_key = "owner"
# gas_wallet = "gas"
