# atakit configuration
# Precedence: CLI args > env vars > this file > defaults

[image]
# GitHub repositories (owner/repo) for image commands.
# Accepts a single string or an array. First entry is the default for `image pull`.
# repositories = "automata-network/automata-linux"
# repositories = ["automata-network/automata-linux", "automata-network/debug-linux"]
# Default platforms for `image pull` (comma-separated: gcp, aws, azure).
# platforms = ["gcp"]
# Default limit for `image ls`.
# list_limit = 10

[github]
# GitHub API token (or set GITHUB_TOKEN env var).
# token = "ghp_..."

[build]
# Container engine: "auto", "docker", or "podman".
# container_engine = "auto"

[publish]
# Ethereum RPC URL for workload publish (or set ATAKIT_RPC_URL).
# rpc_url = "https://..."
# Session registry contract address (or set ATAKIT_SESSION_REGISTRY).
# session_registry = "0x..."
# Path to file containing the owner private key (hex). chmod 600 recommended.
# owner_key_file = "~/.config/atakit/owner_key"
# Path to file containing the relay private key (hex). chmod 600 recommended.
# relay_key_file = "~/.config/atakit/relay_key"

[workload]
# Workload repository configuration. Two repository types are supported:
# `http` (in-house workload registry service) and `github` (GitHub releases).
# default_repository = "main"
# Named repositories. The CLI flag --repository accepts a name from this map,
# a raw http(s)://... URL, or a bare owner/repo path.
# Set ATAKIT_WORKLOAD_REPOSITORY_URL to populate a `default` HTTP entry from env.
# [workload.repositories.main]
# type = "http"
# url = "https://registry.example.com"
# [workload.repositories.gh-fallback]
# type = "github"
# repo = "automata-network/workload-archives"

[cloud]
# Default expire offset for CVM agent sessions (seconds).
# expire_offset = 3600
# RPC URL (falls back to [publish] rpc_url if not set here).
# rpc_url = "https://..."
# Session registry (falls back to [publish] session_registry).
# session_registry = "0x..."
# Default key files (falls back to [publish] equivalents).
# owner_key_file = "~/.config/atakit/owner_key"
# relay_key_file = "~/.config/atakit/relay_key"

# Cloud deployment targets.
# [cloud.targets.my-gcp]
# platform = "gcp"
# project = "my-gcp-project"
# region = "us-central1-a"
# vmtype = "c3-standard-4"
# cc_type = "SEV_SNP"  # or "TDX"
# Per-target key overrides:
# owner_key_file = "~/.config/atakit/my_owner_key"

# [cloud.targets.my-azure]
# platform = "azure"
# subscription = "your-subscription-id"
# region = "eastus"
# vmtype = "Standard_DC4as_v5"
# cc_type = "SEV_SNP"  # or "TDX"
