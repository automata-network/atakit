# atakit configuration
# Precedence: CLI args > env vars > this file > defaults
#
# This template is written on first run. Feel free to edit or delete
# entries you don't need; the defaults will take over.

# ─── GitHub credentials ───────────────────────────────────────────────
#
# Named token sources for GitHub API access. Each credential sets
# EXACTLY ONE of `file` / `command` / `env`. Repositories reference a
# credential by name via `credential = "<name>"`; a repository without
# `credential` makes anonymous requests (public repos only).
#
# `command` credentials default to a 30-second timeout. Override per
# credential with `timeout_secs = <n>` when a helper is known to be
# slow (biometric prompts, remote HSMs). `timeout_secs` is only valid
# alongside `command`.
#
# Section form is also valid when a credential wants inline comments:
#   [github.credentials.public]
#   file = "~/.config/atakit/tokens/public"

# [github.credentials]
# public      = { file    = "~/.config/atakit/tokens/public" }
# private     = { command = ["pass", "show", "github/atakit-private"] }
# ci          = { env     = "GH_CI_TOKEN" }
# slow-helper = { command = ["op", "read", "op://Private/gh/token"], timeout_secs = 90 }

# ─── Image repositories ───────────────────────────────────────────────
#
# Named GitHub repositories that hold `.atabi` image archives.
# Declaration order matters: the first entry is the implicit default
# for `image pull` when no image reference is given.
#
# Each entry may set `list_limit = <n>` to override the global
# `[image] list_limit`. Precedence: `--limit` CLI flag > per-repo
# `list_limit` > global `[image] list_limit`.

[image]
# Global default limit for `image ls`.
# list_limit = 10
# Default platforms for `image pull` (comma-separated: gcp, aws, azure).
# platforms = ["gcp"]

# [image.repositories]
# automata = { repo = "automata-network/automata-linux" }
# debug    = { repo = "automata-network/debug-linux" }
# private  = { repo = "myorg/private-images", credential = "private" }
# fast-dev = { repo = "myorg/dev-mirror", list_limit = 3 }

# ─── Build ────────────────────────────────────────────────────────────

[build]
# Container engine: "auto", "docker", or "podman".
# container_engine = "auto"

# ─── Publish ──────────────────────────────────────────────────────────

[publish]
# Ethereum RPC URL for workload publish (or set ATAKIT_RPC_URL).
# rpc_url = "https://..."
# Session registry contract address (or set ATAKIT_SESSION_REGISTRY).
# session_registry = "0x..."
# Path to file containing the owner private key (hex). chmod 600 recommended.
# owner_key_file = "~/.config/atakit/owner_key"
# Path to file containing the relay private key (hex). chmod 600 recommended.
# relay_key_file = "~/.config/atakit/relay_key"

# ─── Workload repositories ────────────────────────────────────────────
#
# Tagged inline tables: each entry is either `type = "http"` (in-house
# workload registry service) or `type = "github"` (GitHub releases).
# Declaration order matters: the first entry is the implicit default
# for `workload push` when no `--repository` is given.
#
# The `--repository` CLI flag accepts:
# * a configured repository name (e.g. `main`, `gh-public`),
# * a raw `http(s)://...` URL (treated as an HTTP repository),
# * a bare `owner/repo` path (treated as a GitHub repository; if a
#   configured entry has the same repo path, its credential is
#   inherited so private-repo shorthand still works).
#
# `workload pull` and `workload ls --remote` fan out across EVERY
# configured entry in declaration order and merge results; the first
# entry is not special for multi-target commands.
#
# CI / scripting note: there is no env var that selects a workload
# repository. The old `ATAKIT_WORKLOAD_REPOSITORY_URL` was removed.
# Pass `--repository <name|url|owner/repo>` on every command instead.
# Credentials can still come from env via
# `[github.credentials.ci] = { env = "GH_CI_TOKEN" }` so CI only needs
# to set the token env var, not rewrite this file at runtime.

# [workload.repositories]
# main       = { type = "http",   url  = "https://registry.example.com" }
# gh-public  = { type = "github", repo = "automata-network/workload-archives", credential = "public" }
# gh-private = { type = "github", repo = "myorg/private-workloads",            credential = "private" }

# ─── Cloud ────────────────────────────────────────────────────────────

[cloud]
# Default expire offset for CVM agent sessions (seconds).
# expire_offset = 3600
# RPC URL (falls back to [publish] rpc_url if not set here).
# rpc_url = "https://..."
# Session registry (falls back to [publish] session_registry).
# session_registry = "0x..."
# Default key files (falls back to [publish] equivalents).
# owner_key_file = "~/.config/atakit/owner_key"
# relay_key_file = "~/.config/atakit/relay_key"

# Cloud deployment targets.
# [cloud.targets.my-gcp]
# platform = "gcp"
# project = "my-gcp-project"
# region = "us-central1-a"
# vmtype = "c3-standard-4"
# cc_type = "SEV_SNP"  # or "TDX"
# Per-target key overrides:
# owner_key_file = "~/.config/atakit/my_owner_key"

# [cloud.targets.my-azure]
# platform = "azure"
# subscription = "your-subscription-id"
# region = "eastus"
# vmtype = "Standard_DC4as_v5"
# cc_type = "SEV_SNP"  # or "TDX"
