[package]
name = "atakit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "atakit"
path = "src/main.rs"

[dependencies]
atakit-emulator.workspace = true
fs2.workspace = true
atakit-core.workspace = true
atakit-cvm-encoding.workspace = true
atakit-cvm-types.workspace = true
atakit-config.workspace = true
atakit-image = { workspace = true, features = ["cli"] }
atakit-workload = { workspace = true, features = ["cli"] }
atakit-cloud = { workspace = true, features = ["cli"] }
atakit-attestation.workspace = true
atakit-attestation-client.workspace = true

chrono.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
reqwest.workspace = true
toml.workspace = true
indicatif.workspace = true
shell-escape.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
owo-colors.workspace = true
terminal_size = "0.4"
indexmap = { version = "2", features = ["serde"] }
alloy-ext.workspace = true
automata-tee-workload-measurement.workspace = true
hex.workspace = true
sha2.workspace = true
k256.workspace = true
nix = { version = "0.29", features = ["term"] }
zeroize = "1"
bytes = "1.11"
serde_json_canonicalizer.workspace = true
tar.workspace = true
flate2.workspace = true
futures-util.workspace = true

tempfile.workspace = true

[dev-dependencies]
