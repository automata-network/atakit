name: ci

on:
  pull_request:
    branches: [atakit-ng]
  push:
    branches: [atakit-ng]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    # Non-blocking until the codebase is fully cargo-fmt clean. Flip to false
    # after a one-time `cargo fmt --all` cleanup PR lands.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    # Non-blocking until the existing -D warnings findings are addressed.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --locked

  macos-cli:
    name: macOS ARM64 CLI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build and check CLI
        run: |
          set -euo pipefail
          cargo build --release --locked -p atakit-cli --target aarch64-apple-darwin
          bin=target/aarch64-apple-darwin/release/atakit
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "atakit-cli"))')
          test "$("$bin" --version)" = "atakit $version"
          "$bin" --help
          strip "$bin"
          mkdir -p dist
          out="atakit-v${version}-macos-arm64"
          cp "$bin" "dist/$out"
          (cd dist && shasum -a 256 "$out" > "$out.sha256")
          git rev-parse HEAD > dist/source-commit.txt
      - name: Save CLI build for verification
        uses: actions/upload-artifact@v4
        with:
          name: atakit-macos-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error
