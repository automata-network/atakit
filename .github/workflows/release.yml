name: release

on:
  push:
    # Verifierd has its own release workflow and version tags.
    tags: ['v*', '!verifierd-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing CLI release tag to build (for example, v0.7.5)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --remap-path-prefix=/home/runner=/build --remap-path-prefix=/Users/runner=/build --remap-path-prefix=${{ github.workspace }}=/atakit
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    # Each matrix job publishes its own binary straight to the release. We
    # deliberately avoid actions/upload-artifact (cross-job hand-off) because
    # release-asset uploads don't count against the Actions artifact storage
    # quota, whereas large run artifacts do. max-parallel: 1 so the first job
    # creates the release and the second appends to it (no create race).
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a CLI release tag such as v0.7.5' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build atakit
        run: cargo build --release --locked -p atakit-cli --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/atakit"
          strip "$bin"
          test "$("$bin" --version)" = "atakit ${RELEASE_TAG#v}"
          out="atakit-${RELEASE_TAG}-${{ matrix.platform }}"
          cp "$bin" "dist/${out}"
          chmod +x "dist/${out}"
          (cd dist && shasum -a 256 "${out}" > "${out}.sha256")
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          body_path: RELEASE-NOTES.md
          draft: true
          fail_on_unmatched_files: true
